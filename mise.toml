[tools]
go = "1.26.5"

[tasks.build]
description = "Build the devbox binary into ./bin"
run = "go build -o bin/devbox ./cmd/devbox"

[tasks.test]
description = "Run every package test"
run = "go test ./..."

[tasks.race]
description = "Run the tests under the race detector"
run = "go test -race ./..."

[tasks.check]
description = "The gate: build, vet, format check, and tests"
run = """
go build ./...
go vet ./...
test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
go test ./...
"""

[tasks.install]
description = "Install the binary onto PATH"
run = "go build -o ~/.local/bin/devbox ./cmd/devbox"
